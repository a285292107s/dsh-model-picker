name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The five gates in one pass: build + test:fresh (lib/ drift), selfcheck
      # (static contracts), contrast (skips when the host theme is absent, as on
      # CI) and the params unit gate.
      - run: npm test
